<svg xmlns="http://www.w3.org/2000/svg" width="420" height="262" viewBox="0 0 420 262" role="img" aria-labelledby="title description">
  <title id="title">Two ways into the Eishin campus</title>
  <desc id="description">The early sequence led from the entrance street to the university center and then the high-school street. The revised sequence led from the entrance street along the high-school street to the university center on the ridge.</desc>
  <rect width="420" height="262" rx="3" fill="#f5eedf"/>
  <path d="M210 18V244" stroke="#bdb19a" stroke-dasharray="2 5"/>
  <g font-family="Georgia, 'Times New Roman', serif" text-anchor="middle" fill="#352c26">
    <g font-size="20" font-style="italic" fill="#783a40">
      <text x="105" y="35">Early scheme</text>
      <text x="315" y="35">Revised scheme</text>
    </g>
    <g font-size="19">
      <text x="105" y="78">Entrance street</text>
      <text x="315" y="78">Entrance street</text>
      <text x="105" y="144">University center</text>
      <text x="315" y="144">High-school street</text>
      <text x="105" y="210">High-school street</text>
      <text x="315" y="210">University center</text>
      <text x="315" y="234" font-size="17" font-style="italic">on the ridge</text>
    </g>
  </g>
  <g fill="none" stroke="#783a40" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
    <path d="M105 92v26m-5-6 5 6 5-6 M315 92v26m-5-6 5 6 5-6"/>
    <path d="M105 158v26m-5-6 5 6 5-6 M315 158v26m-5-6 5 6 5-6"/>
  </g>
</svg>
